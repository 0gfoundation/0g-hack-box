# hack-box lockdown. Installed to /etc/hackbox/conf.d/30-lockdown.conf by setup/80-lockdown.sh
# and refreshed on every run. Put overrides in /etc/hackbox/conf.d/39-lockdown-local.conf
# and rerun setup/80-lockdown.sh.

# Attendee slice (user-2000.slice). Empty means computed at install time:
#   HACKER_MEM_MAX   HACKER_MEM_PCT percent of RAM (16 GB box: about 12G)
#   HACKER_MEM_HIGH  eleven twelfths of HACKER_MEM_MAX (about 11G)
#   HACKER_CPU_QUOTA (hardware threads - HACKER_CPU_RESERVE) x 100%, at least 100%
# Values use systemd syntax (12G, 11800M, 1400%).
HACKER_MEM_MAX=""
HACKER_MEM_HIGH=""
HACKER_MEM_PCT=75
HACKER_SWAP_MAX=2G
HACKER_CPU_QUOTA=""
HACKER_CPU_RESERVE=2
HACKER_TASKS_MAX=4096
# pam_limits nproc for the attendee, a second fork bomb ceiling outside systemd.
HACKER_NPROC=4096

# Network (table inet hackbox).
# IPv4 addresses or CIDRs the attendee may reach even though they are private, for
# example a venue service. Space separated. Empty: none.
NFT_ALLOW4=""
# Extra TCP ports accepted inbound from any interface. Default: none (the tailnet only).
# The VM lab reaches the guest's sshd over the virtual LAN, so the lab sets "22" here.
# setup/80-lockdown.sh also keeps 22 open by itself when it is run over a non-tailnet ssh
# session, so the install can never lock out its own operator.
NFT_INBOUND_TCP=""
# Tailscale tag for kiosks (read by setup/05-tailscale.sh on reruns and by
# `hackbox lock status`). Empty: the box joins untagged. See files/lockdown/tailscale-acl.hujson.
TS_TAG=""
# tailscaled's WireGuard port, accepted inbound so direct peer connections keep working.
TS_UDP_PORT=41641

# USB mass storage: allow (attendees may copy work out; no auto-open) or block (kernel
# module blacklist, also stops the organisers' own sticks).
USB_STORAGE=allow

# Chromium managed policy.
CHROMIUM_HOME_URL=https://docs.0g.ai/
# Extension ids allowed despite the install blocklist. Default: MetaMask.
CHROMIUM_EXTENSION_ALLOWLIST="nkbihfbeogaeaoehlefnkodbefgpgknn"
