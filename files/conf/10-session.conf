# hack-box session engine settings. Installed to /etc/hackbox/conf.d/ by
# setup/60-hacker.sh and overwritten on every run, so put per-box changes in
# a later fragment such as /etc/hackbox/conf.d/90-local.conf instead.
# Plain shell KEY=value, sourced in order by every helper.

HACKER_USER=hacker
HACKER_UID=2000

# Length of one slot, and when the countdown warns (minutes left).
SESSION_MINUTES=30
WARN_MINUTES="5 1"

# How long the "time is up" screen stays up before the wipe.
END_GRACE_SECONDS=20

# Size of the loop-mounted home image. Shrunk automatically at reset time if
# the disk cannot hold it plus HOME_IMG_RESERVE of headroom for the system.
HOME_IMG_SIZE=40G
HOME_IMG_RESERVE=4G

# Project archives: kept this many hours, capped at this many MB before
# compression. A .git directory larger than ARCHIVE_GIT_MAX_MB has its
# objects left out.
ARCHIVE_HOURS=24
ARCHIVE_MAX_MB=200
ARCHIVE_GIT_MAX_MB=50

# tmpfs caps, applied by setup/70-session.sh through /etc/fstab (next boot).
TMP_SIZE=2G
VAR_TMP_SIZE=1G
SHM_SIZE=2G
