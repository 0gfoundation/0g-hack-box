# hack-box: event branding and extras for the attendee screens (read by the overlay).
# REWARD_TEXT: mentioned on the welcome and time-up screens (empty: not mentioned).
# START_URL: opened in Firefox on the right 30 % of the screen when a session starts, next to
# the agent's terminal on the left 70 % (empty: terminal full screen as before).
REWARD_TEXT='$10 of 0G Compute credit'
START_URL='https://build.0g.ai/dev-day-2026/hacker-zone'
# Default model for OpenCode (and the attendee's own code, OG_MODEL in ~/.config/hackbox/env).
# 0GM is 0G's in-house model; GLM-5.3 stays selectable in OpenCode with /models.
OG_MODEL=0gm-1.0-35b-a3b
