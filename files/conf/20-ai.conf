# hack-box AI agents. Installed to /etc/hackbox/conf.d/20-ai.conf by setup/65-ai.sh and
# refreshed on every run. Do not edit the installed copy: put box or lab overrides in
# /etc/hackbox/conf.d/29-ai-local.conf (sourced later, never touched by the repo), then run
# `hackbox agents set` again. No secrets here: keys live in /etc/hackbox/secrets/.

# Agents offered when nobody has chosen yet (`hackbox agents set default`).
# Any of: claude, claude-0g, opencode. claude and claude-0g are mutually exclusive.
AGENTS_DEFAULT="claude opencode"

# Claude Code on Anthropic: apikey (default), gateway or subscription.
#   apikey        organiser Console key in secrets/anthropic-api-key, read by apiKeyHelper
#   gateway       LLM gateway at CLAUDE_GATEWAY_URL, per-box token in secrets/claude-gateway-token
#   subscription  CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`, in secrets/claude-oauth-token.
#                 Anthropic's consumer terms do not allow sharing a subscription across
#                 public kiosks. This route exists because the organisers asked; it is their call.
CLAUDE_AUTH=apikey
CLAUDE_GATEWAY_URL=""
# Point the Anthropic routes (apikey, subscription) at another base URL, for example the
# lab's stand-in gateway. Empty means Anthropic's default endpoint.
ANTHROPIC_BASE_URL_OVERRIDE=""
# Model allowlist and default for the claude agent (aliases or model ids).
CLAUDE_MODELS="sonnet haiku"
CLAUDE_DEFAULT_MODEL=sonnet
CLAUDE_MAX_EFFORT=high
# apt channel for the claude-code package (stable or latest) and an optional exact
# version to pin (empty: whatever the channel serves at install time, then held).
CLAUDE_CODE_CHANNEL=stable
CLAUDE_CODE_VERSION=""

# 0G Compute Router. Used by opencode (OpenAI-compatible path, OG_ROUTER_URL/v1) and by
# claude-0g (Anthropic-compatible path, OG_ROUTER_URL/v1/messages). Key in secrets/0g-router-key.
OG_ROUTER_URL=https://router-api.0g.ai
OG_MODEL=glm-5.3
OG_SMALL_MODEL=0gm-1.0-35b-a3b
OG_FALLBACK_MODEL=kimi-k2.7-code
# Real context window of OG_MODEL, so Claude Code does not compact at 200K (0G's guide).
OG_CONTEXT_TOKENS=983616
# Claude model ids that claude-0g maps to OG_SMALL_MODEL through modelOverrides, so the
# auto mode permission check runs on the cheap model (0G's Claude Code guide).
OG_SONNET_IDS="claude-sonnet-5 claude-sonnet-5-5"

# OpenCode pinned release. OPENCODE_SHA256 is checked for the linux-x64 asset; every
# asset is also checked against the digest the GitHub releases API publishes.
OPENCODE_VERSION=1.18.33
OPENCODE_SHA256=e546123213ae47909a4268692aa4b94950d011afe9cac9938753a2194f1c16d5

# One line shown by Claude Code at startup.
AI_ANNOUNCEMENT="Welcome to the 0G hacker zone. You have 30 minutes and this machine is wiped after your slot. Do not enter personal passwords or keys."
